name: Convert Model to CT2

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
    - name: Install dependencies
      run: pip install ctranslate2 sentencepiece huggingface_hub transformers

    - name: Download model
      run: python3 -c "import base64; exec(base64.b64decode('CmltcG9ydCBvcwpvcy5lbnZpcm9uWydIRl9FTkRQT0lOVCddID0gJ2h0dHBzOi8vaGYtbWlycm9yLmNvbScKZnJvbSBodWdnaW5nZmFjZV9odWIgaW1wb3J0IHNuYXBzaG90X2Rvd25sb2FkCnNuYXBzaG90X2Rvd25sb2FkKCdIZWxzaW5raS1OTFAvb3B1cy1tdC1lbi16aCcsIGxvY2FsX2Rpcj0nb3B1cy1tdC1lbi16aCcpCnByaW50KCfkuIvovb3lrozmiJAnKQo=').decode())"

    - name: Convert with transformers converter
      run: |
        ct2-transformers-converter \
          --model Helsinki-NLP/opus-mt-en-zh \
          --low_cpu_mem_usage \
          --output_dir opus-mt-en-zh-ct2 \
          --quantization int8 \
          --force
        echo "=== 转换完成 ==="
        ls -lh opus-mt-en-zh-ct2/

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: opus-mt-en-zh-ct2
        path: opus-mt-en-zh-ct2/
        retention-days: 7
